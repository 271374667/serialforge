site_name: SerialForge
site_description: 面向 Windows 10/11 x64 的 PySide6 串口通讯库
site_url: https://271374667.github.io/serialforge/
repo_url: https://github.com/271374667/serialforge
repo_name: 271374667/serialforge
edit_uri: edit/dev/docs/
copyright: MIT License

docs_dir: docs
site_dir: outputs/04_docs_site

nav:
  - 新手入门:
      - 项目介绍: index.md
      - 快速开始: beginner/getting-started.md
      - 简单示例: beginner/examples.md
  - 进阶指南:
      - 总览: advanced/index.md
      - 声明与响应模式: advanced/declarations.md
      - 发送、回调与取消: advanced/sending.md
      - 扫描与连接: advanced/scan-connect.md
      - 原始接收与日志: advanced/receiving.md
      - 流式与主动上报: advanced/stream-events.md
      - 接收定界与编码: advanced/framing.md
      - 生命周期与重连: advanced/lifecycle.md
      - 错误与诊断: advanced/errors.md
      - 完整示例: advanced/examples.md
  - API 参考: api.md
  - 平台与限制: platform.md
  - 附录:
      - 串口入门: appendix/serial-primer.md
      - 术语表: appendix/glossary.md

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: zh
