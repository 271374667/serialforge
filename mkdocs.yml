site_name: serialforge
site_description: 面向 Windows 10/11 x64 的 PySide6 串口通讯库
site_url: https://271374667.github.io/serialforge/
repo_url: https://github.com/271374667/serialforge
repo_name: 271374667/serialforge
edit_uri: edit/dev/docs/
copyright: MIT License

docs_dir: docs
site_dir: outputs/04_docs_site

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 使用指南: usage.md
  - 示例: examples.md
  - API 参考: api.md
  - 平台与限制: platform.md

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: zh
