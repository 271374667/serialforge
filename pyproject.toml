[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "serialforge"
version = "0.0.1"
description = "Qt6 Core serial communication toolkit for Windows"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "pyserial>=3.5",
]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals :: Serial",
    "Typing :: Typed",
]

[project.optional-dependencies]
pyside6 = ["PySide6-Essentials>=6.11.2"]
pyqt6 = ["PyQt6>=6.11"]
pyqt5 = ["PyQt5>=5.15.11"]

[dependency-groups]
dev = [
    "PySide6-Essentials>=6.11.2",
    "pylint",
    "pytest",
    "pytest-qt",
    "pytest-xdist>=3.8.0",
    "ruff",
    "twine",
    "ty",
    "typing-extensions>=4.6",
]

[tool.uv]
# 只面向 Windows x64：PyQt5-Qt5 等包的较新版本缺少 win_amd64 wheel，
# 声明必需环境后 uv 才会锁定带 Windows 轮子的版本（见 rules/09）。
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/serialforge"]
exclude = ["**/__pycache__", "**/*.pyc", "src/serialforge/testing"]

[tool.hatch.build.targets.sdist]
include = ["src/serialforge", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["**/__pycache__", "**/*.pyc", "src/serialforge/testing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -n auto --maxprocesses=4 --dist worksteal"
markers = [
    "hardware: requires a real Windows serial device",
]

[tool.ruff]
target-version = "py311"
line-length = 80
exclude = [".agents", "temp", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.11"
python-platform = "win32"

[tool.ty.src]
exclude = [".agents", ".venv", ".venv-*", "dist", "build", "temp", "outputs"]

[tool.ty.rules]
all = "error"
